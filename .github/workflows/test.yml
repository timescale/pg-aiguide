name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # PRs from forks stay on GitHub-hosted runners so outside code never runs in the CI account.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'runs-on/fleet=linux-2cpu-x64/env=ue1' }}

    steps:
      - uses: runs-on/action@284bff869d4a825f778ac7c38e50f1e31ef198fd # v2.6.0
        if: ${{ !github.event.pull_request.head.repo.fork }}
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: ./bun install
      - name: Run tests
        run: ./bun test
      - name: Smoke test packed npm MCP server
        run: ./bun run smoke:npm

  npm-migrations:
    # PRs from forks stay on GitHub-hosted runners so outside code never runs in the CI account.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'runs-on/fleet=linux-2cpu-x64/env=ue1' }}

    steps:
      - uses: runs-on/action@284bff869d4a825f778ac7c38e50f1e31ef198fd # v2.6.0
        if: ${{ !github.event.pull_request.head.repo.fork }}
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: ./bun install
      - name: Build PostgreSQL test image with pgvector and pg_textsearch
        run: docker build -f docker/test-migrations/Dockerfile -t pg-aiguide-migrations-test .
      - name: Smoke test npm launcher with database migrations
        run: ./bun run smoke:npm-migrations
