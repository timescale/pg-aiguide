name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: ./bun install
      - name: Run tests
        run: ./bun test
      - name: Smoke test packed npm MCP server
        run: ./bun run smoke:npm
