name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint TypeScript
    # PRs from forks stay on GitHub-hosted runners so outside code never runs in the CI account.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'runs-on/fleet=linux-2cpu-x64/env=ue1' }}

    steps:
      - uses: runs-on/action@284bff869d4a825f778ac7c38e50f1e31ef198fd # v2.6.0
        if: ${{ !github.event.pull_request.head.repo.fork }}
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: ./bun install
      - name: Run Biome
        run: ./bun run lint
      - name: Typecheck
        run: ./bun run typecheck
      - name: Validate skills
        run: ./bun run validate-skills

  lint-python:
    name: Lint Python
    # PRs from forks stay on GitHub-hosted runners so outside code never runs in the CI account.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'runs-on/fleet=linux-2cpu-x64/env=ue1' }}
    defaults:
      run:
        working-directory: ingest

    steps:
      - uses: runs-on/action@284bff869d4a825f778ac7c38e50f1e31ef198fd # v2.6.0
        if: ${{ !github.event.pull_request.head.repo.fork }}
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ./ingest/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: ingest/uv.lock

      - name: Install python dependencies
        run: uv sync

      # Fails if pyproject.toml and uv.lock have drifted apart, which would
      # otherwise only show up as a surprise resolution during an ingest run.
      - name: Check lockfile is up to date
        run: uv lock --check

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run ruff
        run: uv run ruff check --output-format github .

      - name: Check importer startup
        env:
          PYTHONPATH: ..
        run: |
          uv run python tiger_docs.py --help
          uv run python postgres_docs.py --help
          uv run python postgis_docs.py --help
