name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint TypeScript
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: ./bun install
      - name: Run Biome
        run: ./bun run lint
      - name: Typecheck
        run: ./bun run typecheck
      - name: Validate skills
        run: ./bun run validate-skills

  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ./ingest/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: ingest/uv.lock

      - name: Install python dependencies
        run: uv sync

      # Fails if pyproject.toml and uv.lock have drifted apart, which would
      # otherwise only show up as a surprise resolution during an ingest run.
      - name: Check lockfile is up to date
        run: uv lock --check

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run ruff
        run: uv run ruff check --output-format github .
