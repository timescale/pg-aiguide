name: Ingest Tiger Docs

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

# Both jobs stage into the same _tmp tables, so queue the runs instead of
# letting them overlap. The ingest also takes a database lock, for the case of
# a run that starts outside of this workflow.
concurrency:
  group: ingest-tiger-docs
  cancel-in-progress: false

jobs:
  ingest-dev:
    name: Ingest Tiger docs for Dev
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PGHOST: ${{ secrets.PGHOST }}
      PGPORT: ${{ secrets.PGPORT }}
      PGDATABASE: ${{ secrets.PGDATABASE }}
      PGUSER: ${{ secrets.PGUSER }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
    steps: &ingest-steps
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ./ingest/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: ingest/uv.lock

      - name: Install python dependencies
        run: uv sync --no-dev

      - name: Ingest Tiger docs
        run: uv run python tiger_docs.py
        env:
          PYTHONPATH: ..

  ingest-prod:
    name: Ingest Tiger docs for Prod
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PGHOST: ${{ secrets.PROD_PGHOST }}
      PGPORT: ${{ secrets.PROD_PGPORT }}
      PGDATABASE: ${{ secrets.PROD_PGDATABASE }}
      PGUSER: ${{ secrets.PROD_PGUSER }}
      PGPASSWORD: ${{ secrets.PROD_PGPASSWORD }}
    steps: *ingest-steps
